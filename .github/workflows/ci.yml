name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Builds and tests untrusted pull request code; the token only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS are the platforms Freizeichen ships for; Linux is where the
        # DL500A is tested by hand today and where the format check runs.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Freizeichen.slnx --locked-mode

      - name: Build
        run: dotnet build Freizeichen.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Freizeichen.slnx -c Release --no-build

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Freizeichen.slnx --verify-no-changes --no-restore
