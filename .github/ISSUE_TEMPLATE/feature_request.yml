name: Feature request
description: Suggest an idea or improvement for Freizeichen
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that Freizeichen does not support, or does badly?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or how you handle this today.
  - type: textarea
    id: phone
    attributes:
      label: Other phone?
      description: If this is about supporting another phone, its model and what `AT`, `AT+CGMI` and `ATD` return on its Bluetooth serial port.
