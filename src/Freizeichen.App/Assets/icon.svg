<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon for Freizeichen: a telephone handset sounding its dial tone, on Lagebuch's dark
       tile in its signal-red/amber, so the two read as one family (AppBgColor #0B0E13,
       SurfaceColor #141A24, SignalColor #FF3D2E, AmberColor #FFB23E). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141A24"/>
      <stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>
    <linearGradient id="handset" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3D2E"/>
      <stop offset="0.6" stop-color="#FF5A3C"/>
      <stop offset="1" stop-color="#FFB23E"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#tile)"/>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="none" stroke="#FF3D2E" stroke-opacity="0.18" stroke-width="8"/>

  <!-- handset, drawn level with its cups facing down, then tilted -->
  <g transform="translate(470 560) rotate(-135) scale(0.82)" fill="url(#handset)">
    <path d="M -250 30 Q 0 -170 250 30" fill="none" stroke="url(#handset)" stroke-width="120" stroke-linecap="round"/>
    <rect x="-370" y="10" width="220" height="130" rx="56" transform="rotate(14 -260 75)"/>
    <rect x="150" y="10" width="220" height="130" rx="56" transform="rotate(-14 260 75)"/>
  </g>

  <!-- the dial tone -->
  <g fill="none" stroke="#FFD27A" stroke-opacity="0.92" stroke-width="44" stroke-linecap="round">
    <path d="M 640 300 A 120 120 0 0 1 724 384"/>
    <path d="M 650 196 A 220 220 0 0 1 828 374"/>
  </g>
</svg>
